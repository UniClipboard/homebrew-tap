name: Update Tap

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v prefix)'
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v4

      - name: Download release assets and compute SHA256
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          BASE="https://github.com/UniClipboard/UniClipboard/releases/download/v${VERSION}"

          # CLI assets
          curl -fSL -o cli-arm64.tar.gz "${BASE}/uniclipboard-cli-${VERSION}-aarch64-apple-darwin.tar.gz"
          curl -fSL -o cli-x86_64.tar.gz "${BASE}/uniclipboard-cli-${VERSION}-x86_64-apple-darwin.tar.gz"

          # App assets
          curl -fSL -o app-arm64.dmg "${BASE}/UniClipboard_${VERSION}_aarch64.dmg"
          curl -fSL -o app-x86_64.dmg "${BASE}/UniClipboard_${VERSION}_x64.dmg"

          echo "cli_arm64_sha256=$(shasum -a 256 cli-arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "cli_x86_64_sha256=$(shasum -a 256 cli-x86_64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "app_arm64_sha256=$(shasum -a 256 app-arm64.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "app_x86_64_sha256=$(shasum -a 256 app-x86_64.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update Formula
        env:
          VERSION: ${{ inputs.version }}
          CLI_ARM64_SHA256: ${{ steps.sha.outputs.cli_arm64_sha256 }}
          CLI_X86_64_SHA256: ${{ steps.sha.outputs.cli_x86_64_sha256 }}
        run: |
          cat > Formula/uniclipboard.rb << 'RUBY'
          class Uniclipboard < Formula
            desc "Privacy-first cross-device clipboard sync CLI"
            homepage "https://github.com/UniClipboard/UniClipboard"
            version "VERSION_PLACEHOLDER"
            license "AGPL-3.0-only"

            on_arm do
              url "https://github.com/UniClipboard/UniClipboard/releases/download/v#{version}/uniclipboard-cli-#{version}-aarch64-apple-darwin.tar.gz"
              sha256 "ARM64_SHA256_PLACEHOLDER"
            end

            on_intel do
              url "https://github.com/UniClipboard/UniClipboard/releases/download/v#{version}/uniclipboard-cli-#{version}-x86_64-apple-darwin.tar.gz"
              sha256 "X86_64_SHA256_PLACEHOLDER"
            end

            def install
              bin.install "uniclipboard-cli" => "uniclipboard"
            end

            test do
              system bin/"uniclipboard", "--version"
            end
          end
          RUBY

          # Replace placeholders
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" Formula/uniclipboard.rb
          sed -i "s/ARM64_SHA256_PLACEHOLDER/${CLI_ARM64_SHA256}/g" Formula/uniclipboard.rb
          sed -i "s/X86_64_SHA256_PLACEHOLDER/${CLI_X86_64_SHA256}/g" Formula/uniclipboard.rb

      - name: Update Cask
        env:
          VERSION: ${{ inputs.version }}
          APP_ARM64_SHA256: ${{ steps.sha.outputs.app_arm64_sha256 }}
          APP_X86_64_SHA256: ${{ steps.sha.outputs.app_x86_64_sha256 }}
        run: |
          cat > Casks/uniclipboard.rb << 'RUBY'
          cask "uniclipboard" do
            arch arm: "aarch64", intel: "x64"

            version "VERSION_PLACEHOLDER"
            sha256 arm:   "ARM64_SHA256_PLACEHOLDER",
                   intel: "X86_64_SHA256_PLACEHOLDER"

            url "https://github.com/UniClipboard/UniClipboard/releases/download/v#{version}/UniClipboard_#{version}_#{arch}.dmg"
            name "UniClipboard"
            desc "Privacy-first cross-device clipboard sync"
            homepage "https://github.com/UniClipboard/UniClipboard"

            depends_on macos: ">= :monterey"

            app "UniClipboard.app"

            zap trash: [
              "~/Library/Application Support/app.uniclipboard.desktop",
              "~/Library/Logs/app.uniclipboard.desktop",
              "~/Library/Caches/app.uniclipboard.desktop",
            ]
          end
          RUBY

          # Replace placeholders
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" Casks/uniclipboard.rb
          sed -i "s/ARM64_SHA256_PLACEHOLDER/${APP_ARM64_SHA256}/g" Casks/uniclipboard.rb
          sed -i "s/X86_64_SHA256_PLACEHOLDER/${APP_X86_64_SHA256}/g" Casks/uniclipboard.rb

      - name: Commit and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/uniclipboard.rb Casks/uniclipboard.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "brew: update uniclipboard to v${VERSION}"
          git push
